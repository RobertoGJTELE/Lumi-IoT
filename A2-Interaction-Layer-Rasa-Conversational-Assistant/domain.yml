regex:
  - name: origin
    pattern: '\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|temp\d|hum\d|air\d|cam\d*|cam)\b'
  - name: destination
    pattern: '\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|temp\d|hum\d|air\d|cam\d*|cam)\b'
  - name: operation_block
    pattern: '\b(block|deny|prevent)\b'
  - name: operation_allow
    pattern: '\b(allow|permit|unblock)\b'
  - name: sensor_type
    pattern: '\b(temperature|humidity|motion|light|pressure|gas|smoke|sound|noise|uv|co2|pm2\.5|voc|ozone|flame|rain|wind speed|soil moisture|vibration|leak|radiation|water level|voltage|current|power|flow|speed|ph|turbidity|door|window|occupancy|flood|presence|level)\b'
  - name: location
    pattern: '\b(lab|labs|dorms|server|servers|network|internet|gateway|dmz|lan|campus|classroom|kitchen|greenhouse|warehouse|faculty|students|staff|guests|hr|backend|database|office|room|hall|basement|garage|roof|field|garden|pool|bridge|tank|panel|rack|building|corridor|cold room|incubator|autoclave|conveyor|freezer|motor|studio|house|my house|university|pucrs|ufrgs|att|verizon|hosts|computers|application|entry|external|entrypoint|boardroom|hospital|factory|lobby|meeting room|video server|my mac|macbook|ps4|playstation|dorm|bedroom|residents|student housing)\b'
  - name: node
    pattern: '\b(temp\d|hum\d|air\d|cam\d*|cam|10\.\d{1,3}\.\d{1,3}\.\d{1,3})\b'
  - name: node_group
    pattern: '\b(all|sensors|gateways|actuators|routers|leaves|dodag|root)\b'
  - name: power_action
    pattern: '\b(shutdown|reboot|reset|power off|power_off)\b'
  - name: power_saving_mode
    pattern: '\b(on|off)\b'
  - name: objective_function
    pattern: '\b(OF0|MRHOF|COM-OF|ADAPTIVE-OF|ADDITIVE-OF|EEQ|EL-RPL|RM-RPL|CQAOF|SIGMA)\b'
  - name: duty_cycle
    pattern: '\b(\d+%)\b'
  - name: trickle_algorithm
    pattern: '\b(FL-Trickle|FI-Trickle|D-Trickle|Elastic Trickle|LA-Trickle|EE-Trickle)\b'
  - name: energy_metric
    pattern: '\b(ETX|energy|hop_count|RSSI|residual_energy|buffer_occupancy)\b'
  - name: routing_protocol
    pattern: '\b(RPL|DYMO-LOW|LOAD|HYDRO|Thread|6LoWPAN|6TiSCH)\b'
  - name: hour
    pattern: '\b(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]\b'
  - name: sleep_schedule_start
    pattern: '\b(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]\b'
  - name: sleep_schedule_end
    pattern: '\b(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]\b'
  - name: wake_interval
    pattern: '\b(\d+)\s*(seconds|minutes|hours)\b'

responses:
  utter_greet:
    - text: Hey! How are you?
  utter_thank_you:
    - text: You're welcome!
  utter_did_that_help:
    - text: Did that help you?
  utter_happy:
    - text: Great, carry on!
  utter_goodbye:
    - text: Bye! Thank you!
  utter_ask_for_feedback:
    - text: Hmm, okay. What did I miss?
  utter_start_over:
    - text: Okay. Please start over then.
  utter_ask_entity:
    - text: What type of entity did I miss?
      buttons:
        - title: location
          payload: location
        - title: group
          payload: group
        - title: middlebox
          payload: middlebox
        - title: service
          payload: service
        - title: traffic
          payload: traffic
        - title: protocol
          payload: protocol
        - title: device
          payload: device
        - title: sensor_type
          payload: sensor_type
        - title: air_quality_parameter
          payload: air_quality_parameter
        - title: air_quality_sensor
          payload: air_quality_sensor
  utter_ask_value:
    - text: And what is the value for the {entity}?

actions:
  - action_build
  - action_deploy
  - action_robotics_laws
  - action_feedback
  - action_feedback_confirm
  - action_cancel
