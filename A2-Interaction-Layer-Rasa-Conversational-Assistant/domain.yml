#Definition of the conversational universe: intents, entities, slots, responses, and custom actions.
version: "2.0"
config:
  store_entities_as_slots: true
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

intents:
  - welcome
  - thanks
  - goodbye
  - cancel
  - confirm
  - reject
  - build
  - build-feedback
  - ask_robotics_laws

entities:
  - origin
  - destination
  - qos_value
  - protocol
  - operation
  - entity
  - value
  - location
  - group
  - middlebox
  - service
  - traffic
  - qos_unit
  - qos_constraint
  - hour
  - device
  - sensor_type
  - air_quality_parameter
  - air_quality_sensor
  - node
  - node_group
  - power_action
  - power_saving_mode
  - objective_function
  - duty_cycle
  - trickle_algorithm
  - energy_metric
  - routing_protocol
  - query_type
  - metric_to_show
  - sleep_schedule_start
  - sleep_schedule_end
  - wake_interval
  - sleep_mode
  - security_action
  - encryption_key
  - authentication_mode
  - load_balancing_strategy
  - priority_level
  - threshold_value
  - trickle_imin
  - trickle_imax
  - trickle_redundancy
  - message_type
  - radio_channel
  - tx_power
  - data_rate
  - frequency_hopping
  - simulation_duration
  - comparison
  - prediction
  - alert_condition
  - report_interval
  - firmware_version
  - update_schedule
  - rollback

slots:
  origin:
    type: text
    influence_conversation: true
    auto_fill: true
  destination:
    type: text
    influence_conversation: true
    auto_fill: true
  qos_value:
    type: text
    influence_conversation: true
    auto_fill: true
  protocol:
    type: text
    influence_conversation: true
    auto_fill: true
  operation:
    type: text
    influence_conversation: true
    auto_fill: true
  entity:
    type: categorical
    values:
      - group
      - location
      - middlebox
      - service
      - traffic
      - protocol
      - endpoint
      - device
      - sensor_type
    influence_conversation: true
    auto_fill: true
  value:
    type: text
    influence_conversation: true
    auto_fill: true
  location:
    type: text
    influence_conversation: false
    auto_fill: true
  qos_unit:
    type: text
    influence_conversation: false
    auto_fill: true
  compiled_policy:
    type: any
    influence_conversation: false
  pending_nile_command:
    type: text
    influence_conversation: false
  pending_confirmation:
    type: bool
    influence_conversation: false
  original_entities:
    type: any
    influence_conversation: false
  missing_entity_type:
    type: text
    influence_conversation: false
  missing_entity_value:
    type: text
    influence_conversation: false
  awaiting_feedback:
    type: bool
    influence_conversation: false
  intent_id:
    type: text
    influence_conversation: false
  node:
    type: text
    influence_conversation: true
    auto_fill: true
  node_group:
    type: text
    influence_conversation: true
    auto_fill: true
  power_action:
    type: categorical
    values:
      - shutdown
      - reboot
      - reset
      - power_off
    influence_conversation: true
    auto_fill: true
  power_saving_mode:
