nlu:
- intent: welcome
  examples: |
    - Hey
    - What's up?
    - Hi
    - Hello

- intent: thanks
  examples: |
    - I'm so happy
    - that's great
    - amazing
    - awesome
    - great
    - Thanks a lot!
    - thank you!

- intent: goodbye
  examples: |
    - Great! Bye!
