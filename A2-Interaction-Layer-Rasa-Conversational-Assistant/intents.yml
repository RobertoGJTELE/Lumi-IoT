    - yes I do
    - for sure
    - ok
    - yes that't ok
    - that one works
    - yes you can do it
    - perfect
    - yes
    - why not
    - of course
    - yep that's right
    - okay I will
    - exactly
    - sure why not
    - absolutely
    - it's okay
    - it's fine
    - go ahead
    - confirm
    - sounds good
    - alright
    - yeah
    - yup
    - yes please
    - do it
    - yes I can
    - it looks perfect
    - that's correct
    - right
    - alright why not
    - yep

- intent: reject
  examples: |
    - No
    - no
    - nope
    - nah
    - not really
    - I don't think so
    - I disagree
    - not this time
    - no thanks
    - I don't want that
    - not
    - no way
    - never
    - nothing

- intent: ask_robotics_laws
  examples: |
    - Tell me the three laws of robotics
    - What are the three laws of robotics?
    - Can you state the three laws?
    - I want to know the laws of robotics
